apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.db.rootPassword | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.db.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.db.user | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.db.password | quote }}
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "mysql -u root -prootpassword --socket=/var/lib/mysql/mysql.sock -e 'SELECT 1'"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "mysql -u root -prootpassword --socket=/var/lib/mysql/mysql.sock -e 'SELECT 1'"
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10