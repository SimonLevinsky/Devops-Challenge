name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  pipeline:
    name: Build, Deploy & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Image name & tag ──────────────────────────────────────
      - name: Set lowercase image name
        id: image
        run: echo "IMAGE_NAME=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/app" >> $GITHUB_OUTPUT

      - name: Set image tag based on branch
        id: tag
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      # ── Build & Push ──────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push MySQL image to GHCR
        run: |
          OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
          docker pull mysql:8.0
          docker tag mysql:8.0 ghcr.io/${OWNER}/mysql:8.0
          docker push ghcr.io/${OWNER}/mysql:8.0

      # ── Install tools ─────────────────────────────────────────
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install vCluster CLI (vind)
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/vcluster

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # ── Provision Cluster ─────────────────────────────────────
      - name: Load required kernel modules
        run: |
          sudo modprobe overlay || true
          sudo modprobe bridge || true
          sudo modprobe br_netfilter || true
          lsmod | grep -E "overlay|bridge|br_netfilter" || true

      - name: Set Docker as default driver
        run: vcluster use driver docker

      - name: Write vcluster values file
        run: |
          python3 << 'PYEOF'
          content = """experimental:
            docker:
              nodes:
                - name: worker-1
          """
          with open('/tmp/vcluster-values.yaml', 'w') as f:
              f.write(content)
          PYEOF
          echo "=== Values file ==="
          cat /tmp/vcluster-values.yaml

      - name: Create vind cluster
        run: |
          vcluster create ci-cluster --connect=false --values /tmp/vcluster-values.yaml
          echo "=== vcluster list ==="
          vcluster list
          echo "=== Docker containers after create ==="
          docker ps -a

      - name: Connect to vind cluster
        run: |
          vcluster connect ci-cluster --background-proxy
          sleep 15
          kubectl config view
          kubectl get ns || true

      - name: Wait for node to be ready
        run: |
          echo "Waiting for worker node..."
          for i in $(seq 1 30); do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            if [ "$NODE_COUNT" -gt 0 ]; then
              echo "✅ Node registered!"
              kubectl get nodes
              break
            fi
            echo "⏳ Attempt $i: No nodes yet, waiting 10s..."
            sleep 10
          done
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      # ── Deploy ────────────────────────────────────────────────
      - name: Deploy Helm chart
        run: |
          OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
          helm upgrade --install app ./helm/app \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }} \
            --set image.tag=${{ steps.tag.outputs.IMAGE_TAG }} \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --timeout 10m

      - name: Check pods after deploy
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo "=== MySQL pod describe ==="
          kubectl describe pod -l app=mysql || true
          echo "=== App pod logs ==="
          kubectl logs -l app=app-app --tail=50 || true
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' -A | tail -30

      - name: Debug - MySQL logs
        if: always()
        run: |
          echo "=== MySQL logs ==="
          kubectl logs mysql-0 --tail=80 || true

      - name: Debug - Check pod status
        if: always()
        run: |
          echo "=== All Pods ==="
          kubectl get pods -A --show-labels
          echo "=== All Services ==="
          kubectl get svc -A
          echo "=== Describe ALL pods ==="
          kubectl describe pods -A
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' -A

      - name: Debug - Network info
        if: always()
        run: |
          echo "=== Docker containers ==="
          docker ps
          echo "=== vind container IP ==="
          docker inspect vcluster.cp.ci-cluster | grep IPAddress || true
          echo "=== Kubernetes nodes ==="
          kubectl get nodes -o wide

      # ── Test ──────────────────────────────────────────────────
      - name: Get node IP and test
        run: |
          NODE_IP=$(docker inspect vcluster.node.ci-cluster.worker-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "Worker Node IP: $NODE_IP"
          python3 scripts/test-app.py http://$NODE_IP:30080