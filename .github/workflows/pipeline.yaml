name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  pipeline:
    name: Build, Deploy & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

# ─────────────────────────────────────────────
# Checkout
# ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

# ─────────────────────────────────────────────
# Image Name & Tag
# ─────────────────────────────────────────────
      - name: Set lowercase image name
        id: image
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/app" >> $GITHUB_OUTPUT

      - name: Set image tag based on branch
        id: tag
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

# ─────────────────────────────────────────────
# Docker Build & Push
# ─────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────
# Install kubectl, Helm & vCluster
# ─────────────────────────────────────────────
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install vCluster
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/

# ─────────────────────────────────────────────
# Create vCluster (Docker driver)
# ─────────────────────────────────────────────
      - name: Use Docker driver
        run: vcluster use driver docker

      - name: Create cluster
        run: vcluster create ci-cluster --connect=false --wait

      - name: Generate kubeconfig
        run: |
          vcluster connect ci-cluster \
            --update-current=false \
            --kube-config vcluster.yaml

# ─────────────────────────────────────────────
# Create GHCR Secret
# ─────────────────────────────────────────────
      - name: Create GHCR image pull secret
        env:
          KUBECONFIG: ${{ github.workspace }}/vcluster.yaml
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────
# Helm Deploy
# ─────────────────────────────────────────────
      - name: Add Bitnami repo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Update Helm dependencies
        run: helm dependency update ./helm/app

      - name: Deploy application
        env:
          KUBECONFIG: ${{ github.workspace }}/vcluster.yaml
        run: |
          helm upgrade --install app ./helm/app \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }} \
            --set image.tag=${{ steps.tag.outputs.IMAGE_TAG }} \
            --set image.pullPolicy=Always \
            --set imagePullSecrets[0].name=ghcr-secret \
            --wait \
            --timeout 10m

# ─────────────────────────────────────────────
# Validate Deployment
# ─────────────────────────────────────────────
      - name: Wait for pods
        env:
          KUBECONFIG: ${{ github.workspace }}/vcluster.yaml
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=mysql --timeout=300s
          kubectl wait --for=condition=Ready pod -l app=app-app --timeout=300s
          kubectl get pods -A

# ─────────────────────────────────────────────
# Integration Test
# ─────────────────────────────────────────────
      - name: Test Application
        run: |
          NODE_IP=$(docker inspect vcluster.node.ci-cluster.worker-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "Node IP: $NODE_IP"
          curl --retry 10 --retry-delay 5 http://$NODE_IP:30080 || exit 1

# ─────────────────────────────────────────────
# Debug On Failure
# ─────────────────────────────────────────────
      - name: Debug (only if failure)
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/vcluster.yaml
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo "=== Describe ==="
          kubectl describe pods -A
          echo "=== Logs ==="
          kubectl logs -l app=app-app --tail=100 || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp'