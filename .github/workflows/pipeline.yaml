name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  pipeline:
    name: Build, Deploy & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Image name & tag ──────────────────────────────────────
      - name: Set lowercase image name
        id: image
        run: echo "IMAGE_NAME=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/app" >> $GITHUB_OUTPUT

      - name: Set image tag based on branch
        id: tag
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      # ── Build & Push ──────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Install tools ─────────────────────────────────────────
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install vCluster CLI (vind)
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/vcluster

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # ── Provision Cluster ─────────────────────────────────────
      - name: Set Docker as default driver
        run: vcluster use driver docker

      - name: Create vind cluster
        run: |
          vcluster create ci-cluster --connect=false --add-node worker-1
          echo "=== vcluster list ==="
          vcluster list
          echo "=== Docker containers after create ==="
          docker ps -a

      - name: Connect to vind cluster
        run: |
          vcluster connect ci-cluster --background-proxy
          sleep 10
          echo "=== kubeconfig after connect ==="
          kubectl config view
          echo "=== test kubectl ==="
          kubectl get ns || true

      - name: Wait for cluster to be ready
        run: |
          echo "Waiting for cluster to be ready..."
          for i in $(seq 1 30); do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            if [ "$NODE_COUNT" -gt 0 ]; then
              echo "✅ Nodes are registered!"
              kubectl get nodes
              break
            fi
            echo "⏳ Attempt $i: No nodes yet, waiting 10s..."
            sleep 10
          done
          kubectl get nodes
          kubectl get pods -A || true

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: Verify cluster is running
        run: |
          kubectl get nodes
          docker ps -a

      # ── Deploy ────────────────────────────────────────────────
      - name: Add Bitnami Helm repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update

      - name: Update Helm dependencies
        run: helm dependency update ./helm/app

      - name: Deploy Helm chart
        run: |
          helm upgrade --install app ./helm/app \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME }} \
            --set image.tag=${{ steps.tag.outputs.IMAGE_TAG }} \
            --set image.pullPolicy=Always \
            --timeout 10m \
            --debug

      - name: Wait 30 seconds for pods to start
        run: sleep 30

      - name: Debug - Check pod status
        if: always()
        run: |
          echo "=== All Pods ==="
          kubectl get pods -A --show-labels
          echo "=== All Services ==="
          kubectl get svc -A
          echo "=== Describe ALL pods ==="
          kubectl describe pods -A
          echo "=== Helm Status ==="
          helm status app || true
          echo "=== Helm History ==="
          helm history app || true
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' -A

      - name: Debug - Network info
        if: always()
        run: |
          echo "=== Docker containers ==="
          docker ps
          echo "=== Docker networks ==="
          docker network ls
          echo "=== vind container IP ==="
          docker inspect vcluster.cp.ci-cluster | grep IPAddress || true
          echo "=== Kubernetes nodes ==="
          kubectl get nodes -o wide
          echo "=== All services with ports ==="
          kubectl get svc -A

      # ── Test ──────────────────────────────────────────────────
      - name: Get node IP and test
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          NODE_IP=$(docker inspect vcluster.cp.ci-cluster --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "Node IP: $NODE_IP"
          python3 scripts/test-app.py http://$NODE_IP:30080