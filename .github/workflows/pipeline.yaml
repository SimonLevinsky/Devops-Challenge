name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

# ─────────────────────────────────────────────
# Checkout
# ─────────────────────────────────────────────
      - uses: actions/checkout@v4

# ─────────────────────────────────────────────
# Build & Push Image
# ─────────────────────────────────────────────
      - name: Set image info
        id: vars
        run: |
          IMAGE_NAME=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/app
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${GITHUB_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}

# ─────────────────────────────────────────────
# Install Tools
# ─────────────────────────────────────────────
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install vCluster
        run: |
          curl -L -o vcluster https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/

# ─────────────────────────────────────────────
# Create & Connect vCluster (PERSISTENT)
# ─────────────────────────────────────────────
      - name: Use Docker driver
        run: vcluster use driver docker

      - name: Create cluster
        run: vcluster create ci-cluster --wait

      - name: Connect cluster (persistent kubeconfig)
        run: |
          vcluster connect ci-cluster --update-current
          kubectl cluster-info
          kubectl get nodes

# ─────────────────────────────────────────────
# Create GHCR Secret
# ─────────────────────────────────────────────
      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────
# Deploy with Helm
# ─────────────────────────────────────────────
      - name: Add Bitnami repo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Update dependencies
        run: helm dependency update ./helm/app

      - name: Deploy app
        run: |
          helm upgrade --install app ./helm/app \
            --set image.repository=ghcr.io/${{ steps.vars.outputs.IMAGE_NAME }} \
            --set image.tag=${{ steps.vars.outputs.IMAGE_TAG }} \
            --set imagePullSecrets[0].name=ghcr-secret \
            --wait \
            --timeout 10m

# ─────────────────────────────────────────────
# Validate
# ─────────────────────────────────────────────
      - name: Wait for pods
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=mysql --timeout=300s
          kubectl wait --for=condition=Ready pod -l app=app-app --timeout=300s
          kubectl get pods -A

# ─────────────────────────────────────────────
# Integration Test
# ─────────────────────────────────────────────
      - name: Test app
        run: |
          NODE_IP=$(docker inspect vcluster.node.ci-cluster.worker-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          curl --retry 10 --retry-delay 5 http://$NODE_IP:30080

# ─────────────────────────────────────────────
# Debug on failure
# ─────────────────────────────────────────────
      - name: Debug
        if: failure()
        run: |
          kubectl cluster-info || true
          kubectl get nodes || true
          kubectl get pods -A || true
          kubectl describe pods -A || true
          kubectl logs -l app=app-app --tail=100 || true
          kubectl get events -A --sort-by='.lastTimestamp' || true